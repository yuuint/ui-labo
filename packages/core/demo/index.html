<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yn-prefecture-picker</title>
<link rel="stylesheet" href="/node_modules/@ynetlabo/ui-tokens/dist/tokens.css">
<script type="importmap">
{ "imports": {
  "@ynetlabo/ui-data": "/node_modules/@ynetlabo/ui-data/dist/prefectures.js",
  "@ynetlabo/ui-data/outline": "/node_modules/@ynetlabo/ui-data/dist/japan-outline.js",
  "@ynetlabo/ui-data/normalize": "/node_modules/@ynetlabo/ui-data/src/normalize.js"
} }
</script>
<style>
  body { margin:0; background: var(--color-bg); color: var(--color-ink);
         font-family: system-ui, sans-serif; padding: 28px 20px 80px }
  .wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 22px;
          grid-template-columns: minmax(0,1fr) 240px }
  @media (max-width: 780px) { .wrap { grid-template-columns: 1fr } }
  fieldset { border: 1px solid var(--color-line); border-radius: 10px;
             background: var(--color-surface); padding: 16px 18px 20px; margin: 0 }
  legend { font-size: 12px; color: var(--color-ink3); padding: 0 6px }
  label { display:block; font-size:12px; color: var(--color-ink2); margin: 12px 0 5px }
  input[type=text] { width:100%; height:38px; padding:0 11px; border-radius:6px;
    border:1px solid var(--color-line2); background: var(--color-surface); color: inherit }
  .out { margin-top:14px; padding:12px; border:1px solid var(--color-line); border-radius:8px;
    background: var(--color-surface); font-family: ui-monospace, Menlo, monospace; font-size:12.5px }
  aside { background: var(--color-surface); border:1px solid var(--color-line);
          border-radius:10px; padding:14px; align-self:start }
  aside h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase;
             color: var(--color-ink3); margin:0 0 10px; font-weight:500 }
  .row { margin-bottom:11px }
  .row b { display:block; font-size:11px; color: var(--color-accent);
           font-family: ui-monospace, Menlo, monospace; margin-bottom:4px }
  .seg { display:flex; flex-wrap:wrap; gap:3px }
  .seg button { padding:3px 8px; font-size:11px; border:1px solid var(--color-line2);
    background: var(--color-surface); color: inherit; border-radius:5px; cursor:pointer;
    font-family: ui-monospace, Menlo, monospace }
  .seg button[aria-pressed=true] { background: var(--color-accent); border-color: var(--color-accent); color:#fff }
</style>
</head>
<body>
<div class="wrap">
  <form id="form">
    <fieldset>
      <legend>配送先の入力</legend>
      <label for="nm">お名前</label>
      <input id="nm" type="text" name="name" value="上野 裕貴">
      <label for="pp">都道府県</label>
      <yn-prefecture-picker id="pp" name="prefecture"></yn-prefecture-picker>
      <label for="ct">市区町村・番地</label>
      <input id="ct" type="text" name="city" placeholder="渋谷区渋谷 1-2-3">
      <p style="font-size:11.5px;color:var(--color-ink3);margin:14px 0 0">
        mode="inline" にすると、ダイアログではなく常に表示されたままになります。
      </p>
      <div class="out" id="out">change 待ち</div>
    </fieldset>
  </form>
  <aside>
    <h2>パラメータ</h2>
    <div id="params"></div>
  </aside>
</div>
<script type="module">
import "/packages/core/src/index.js";
const pp = document.getElementById("pp"), out = document.getElementById("out");
const PARAMS = {
  mode: ["dropdown", "inline"],
  selectionLevel: ["prefecture", "area"],
  multiple: ["false", "true"],
  layout: ["map", "list"],
  grouping: ["region9", "region8", "region11", "kana", "none"],
  codeFormat: ["jis", "jisNumber", "ynetlabo", "iso", "name", "shortName"],
  display: ["name", "shortName"],
  searchable: ["true", "false"],
  transition: ["auto", "fade", "slide", "none"],
  footer: ["auto", "none", "count", "count clear"],
};
const attr = (k) => k.replace(/([a-z0-9])([A-Z])/g, "$1-$2").toLowerCase();
const box = document.getElementById("params");
box.innerHTML = Object.entries(PARAMS).map(([k, vs]) =>
  `<div class="row"><b>${k}</b><div class="seg" data-k="${k}">` +
  vs.map(v => `<button type="button" data-v="${v}">${v}</button>`).join("") + `</div></div>`).join("");
const sync = () => {
  for (const [k, vs] of Object.entries(PARAMS)) {
    const cur = String(pp.getAttribute(attr(k)) ?? (k === "multiple" || k === "searchable"
      ? (pp.hasAttribute(attr(k)) ? "true" : (k === "searchable" ? "true" : "false")) : vs[0]));
    box.querySelectorAll(`[data-k="${k}"] button`).forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.v === cur)));
  }
};
box.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  const k = b.closest("[data-k]").dataset.k;
  pp.setAttribute(attr(k), b.dataset.v);
  sync();
});
pp.addEventListener("change", (e) => {
  const fd = new FormData(document.getElementById("form"));
  out.textContent = `value = ${JSON.stringify(e.detail.value)}\nform  = ${JSON.stringify([...fd.entries()])}`;
});
sync();
window.pp = pp;
</script>
</body>
</html>
