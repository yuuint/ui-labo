      <rect x="-32" y="16.9" width="128" height="10.4" fill="#b3cf8a"/>
      <rect x="-32" y="27.2" width="128" height="10.4" fill="#b39a5a"/>
      <rect x="-32" y="37.5" width="128" height="10.4" fill="#c9945f"/>
      <rect x="-32" y="47.8" width="128" height="10.4" fill="#a8564a"/>
      <rect x="-32" y="58.1" width="128" height="10.4" fill="#c48fa8"/>
      <rect x="-32" y="68.4" width="128" height="10.4" fill="#7d6bb0"/>
    </g>
  </g>
</svg>
